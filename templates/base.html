<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}منصة التفتيش{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="{% url 'dashboard' %}">منصة التفتيش</a>
    {% if user.is_authenticated %}
      <nav class="main-nav" aria-label="التنقل الرئيسي">
        <a href="{% url 'dashboard' %}">الزيارات</a>
        <a href="{% url 'institution_list' %}">المؤسسات</a>
      </nav>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="link-button" type="submit">خروج</button>
      </form>
    {% endif %}
  </div>
</header>
<main class="container">
  {% if messages %}
    <section class="messages" aria-live="polite">
      {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
    </section>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
