{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">مراجعي الخاصة</p>
    <h1>{{ title }}</h1>
    {% if source %}<p class="hint">المصدر: {{ source.name }}</p>{% endif %}
  </div>
  <a class="secondary button-link" href="{% url 'reference_list' %}">إلغاء</a>
</section>
<section class="card narrow-form">
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<label>{{ field.label }} {{ field }} {{ field.errors }}</label>{% endfor %}
    <button class="primary" type="submit">حفظ في مكتبتي</button>
  </form>
</section>
{% endblock %}
